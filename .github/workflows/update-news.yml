name: Update AI Longevity Radar

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/update-news.yml"
      - "assets/**"
      - "CNAME"
      - "*.html"
      - "llms.txt"
      - "requirements*.txt"
      - "robots.txt"
      - "scripts/**"
      - "sitemap.xml"
      - "tokens.css"
      - "tests/**"
  schedule:
    - cron: "15 * * * *"

concurrency:
  group: update-ai-longevity-radar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    timeout-minutes: 18
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate source and contracts
        run: |
          python -m pytest -q -p no:cacheprovider
          node --test tests/frontend-core.test.cjs tests/frontend-contract.test.cjs
          node --check assets/core.js
          node --check assets/app.js

      - name: Update public snapshots
        run: python scripts/update_longevity_radar.py --output-dir data --window-hours 24 --archive-days 21

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-24h.json data/latest-relevant.json data/latest-24h-all.json data/briefing-lite.json data/source-status.json data/topic-stats.json data/title-zh-cache.json data/archive.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update longevity radar snapshot"
          git push

  deploy:
    needs: update
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout latest snapshot
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Prepare public site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html methodology.html sources.html tokens.css _site/
          cp CNAME robots.txt sitemap.xml llms.txt _site/
          cp assets/app.js assets/core.js assets/logo.svg assets/styles.css _site/assets/
          cp data/latest-24h.json data/latest-relevant.json data/latest-24h-all.json data/briefing-lite.json data/source-status.json data/topic-stats.json _site/data/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    timeout-minutes: 6
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify production site, JSON, CORS, and Daily integration
        shell: bash
        run: |
          set -euo pipefail
          task_tmp="$(mktemp -d)"
          trap 'rm -rf "$task_tmp"' EXIT

          retry=(--fail --show-error --silent --location --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30)
          curl "${retry[@]}" https://radar.aibioo.cn/ -o "$task_tmp/index.html"
          curl "${retry[@]}" --dump-header "$task_tmp/briefing.headers" https://radar.aibioo.cn/data/briefing-lite.json -o "$task_tmp/briefing.json"
          curl "${retry[@]}" https://radar.aibioo.cn/data/latest-24h.json -o "$task_tmp/latest.json"
          curl "${retry[@]}" https://radar.aibioo.cn/data/latest-relevant.json -o "$task_tmp/relevant.json"
          curl "${retry[@]}" https://radar.aibioo.cn/data/latest-24h-all.json -o "$task_tmp/latest-all.json"
          daily_url="https://news.aibioo.cn/?radar_smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl "${retry[@]}" --header 'Cache-Control: no-cache' "$daily_url" -o "$task_tmp/daily-home.html"

          check_contains() {
            local label="$1"
            local pattern="$2"
            local file="$3"
            if grep -qF "$pattern" "$file"; then
              echo "PASS: $label"
            else
              echo "FAIL: $label (missing: $pattern)" >&2
              return 1
            fi
          }

          check_contains "radar homepage brand" '爱窝啦 AI生命延续学雷达' "$task_tmp/index.html"
          check_contains "radar homepage defaults to relevant signals" 'id="modeRelevantBtn" class="mode-btn active"' "$task_tmp/index.html"
          if tr -d '\r' < "$task_tmp/briefing.headers" | grep -qi '^access-control-allow-origin: \*$'; then
            echo "PASS: briefing JSON CORS"
          else
            echo "FAIL: briefing JSON does not allow cross-origin reads" >&2
            sed -n '1,20p' "$task_tmp/briefing.headers" >&2
            exit 1
          fi
          check_contains "Daily homepage radar link" 'https://radar.aibioo.cn/' "$task_tmp/daily-home.html"
          check_contains "Daily homepage public JSON integration" 'https://radar.aibioo.cn/data/briefing-lite.json' "$task_tmp/daily-home.html"

          python - "$task_tmp/latest.json" "$task_tmp/relevant.json" "$task_tmp/latest-all.json" "$task_tmp/briefing.json" <<'PY'
          import json
          import sys
          from datetime import UTC, datetime

          latest = json.load(open(sys.argv[1], encoding="utf-8"))
          relevant = json.load(open(sys.argv[2], encoding="utf-8"))
          latest_all = json.load(open(sys.argv[3], encoding="utf-8"))
          briefing = json.load(open(sys.argv[4], encoding="utf-8"))
          assert latest["schema_version"] == "bio-radar-v1"
          assert relevant["schema_version"] == "bio-radar-v1"
          assert latest_all["schema_version"] == "bio-radar-v1"
          assert briefing["schema_version"] == "bio-radar-v1"
          assert isinstance(latest.get("items"), list)
          relevant_items = relevant.get("items_relevant") or relevant.get("items") or []
          assert relevant_items, "expected at least one relevant rolling signal"
          assert all(row.get("relevance_tier") in {"core", "related"} for row in relevant_items)
          assert not any(row.get("relevance_tier") == "all" for row in relevant_items)
          all_items = latest_all.get("items_all") or []
          assert len(all_items) >= 50, f"expected full-source feed, got {len(all_items)} items"
          bridged_sources = {str(row.get("site_id") or "") for row in all_items if str(row.get("site_id") or "").startswith("ai_radar_")}
          assert len(bridged_sources) >= 5, f"expected distinct legacy radar sources, got {sorted(bridged_sources)}"
          assert isinstance(briefing.get("items"), list)
          generated = datetime.fromisoformat(latest["generated_at"].replace("Z", "+00:00"))
          assert datetime.now(UTC) - generated < __import__("datetime").timedelta(hours=4)
          print(f"PASS: JSON schema, freshness, {len(relevant_items)} relevant signals, {len(all_items)} full-source items, and {len(bridged_sources)} legacy source groups")
          PY

          final_url="$(curl --fail --show-error --silent --location --output /dev/null --write-out '%{url_effective}' http://radar.aibioo.cn/)"
          test "$final_url" = "https://radar.aibioo.cn/"
          echo "PASS: HTTP redirects to canonical HTTPS"
