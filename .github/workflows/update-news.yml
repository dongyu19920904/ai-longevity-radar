name: Update AI Longevity Radar

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/update-news.yml"
      - "assets/**"
      - "CNAME"
      - "*.html"
      - "llms.txt"
      - "requirements*.txt"
      - "robots.txt"
      - "scripts/**"
      - "sitemap.xml"
      - "tokens.css"
      - "tests/**"
  schedule:
    - cron: "15 * * * *"

concurrency:
  group: update-ai-longevity-radar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    timeout-minutes: 18
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate source and contracts
        run: |
          python -m pytest -q -p no:cacheprovider
          node --test tests/frontend-core.test.cjs tests/frontend-contract.test.cjs
          node --check assets/core.js
          node --check assets/app.js

      - name: Update public snapshots
        run: python scripts/update_longevity_radar.py --output-dir data --window-hours 24 --archive-days 21

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-24h.json data/latest-24h-all.json data/briefing-lite.json data/source-status.json data/topic-stats.json data/title-zh-cache.json data/archive.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update longevity radar snapshot"
          git push

  deploy:
    needs: update
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout latest snapshot
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Prepare public site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html methodology.html sources.html tokens.css _site/
          cp CNAME robots.txt sitemap.xml llms.txt _site/
          cp assets/app.js assets/core.js assets/logo.svg assets/styles.css _site/assets/
          cp data/latest-24h.json data/latest-24h-all.json data/briefing-lite.json data/source-status.json data/topic-stats.json _site/data/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
